<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>HYPER MES</title>
    <script type="text/javascript">
      // GitHub Pages SPA Redirect Fix for Repository Subpath /HYPER-MES/
      (function() {
        var l = window.location;
        var pathSegments = l.pathname.split('/').filter(Boolean);
        var repoName = pathSegments.length > 0 ? pathSegments[0] : '';
        var repoBase = repoName ? '/' + repoName + '/' : '/';
        
        // Preserve hash and query parameters
        var hash = l.hash || '#/';
        var search = l.search || '';
        
        var targetUrl = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + repoBase + search + hash;
        window.location.replace(targetUrl);
      })();
    </script>
  </head>
  <body style="background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; display: flex; items-center: center; justify-content: center; height: 100vh; margin: 0;">
    <div style="text-align: center; padding: 2rem;">
      <h2 style="margin-bottom: 0.5rem; color: #38bdf8;">HYPER MES</h2>
      <p style="color: #94a3b8; font-size: 0.875rem;">Loading application page...</p>
    </div>
  </body>
</html>
